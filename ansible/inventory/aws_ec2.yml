---
# Discovers the PostgreSQL EC2 instances dynamically from AWS.
plugin: amazon.aws.aws_ec2

regions:
  - eu-west-2

# Only discovers running PostgreSQL instances belonging to this environment.
filters:
  instance-state-name: running
  tag:Project: postgresql-ha-sre
  tag:Environment: prod
  tag:Role: PostgreSQL

# Uses the EC2 Name tag as the Ansible inventory hostname.
hostnames:
  - tag:Name
